name: Simple HTML to APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: |
          mkdir -p www && cp index.html www/index.html
          npm init -y && npm i @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "My App" "com.example.myapp" --web-dir www
          npx cap add android && npx cap copy android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: my-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

